[package]
name = "elmee-frontend-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Agent Client Protocol frontend: one warm process serving many editor sessions"
license.workspace = true
repository.workspace = true

[dependencies]
elmee-core = { version = "0.1.0", path = "../../core" }
elmee-host = { version = "0.1.0", path = "../host", default-features = false }
elmee-plugin-tools = { version = "0.1.0", path = "../tools" }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }
