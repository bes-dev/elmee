[package]
name = "elmee-plugin-mesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local peer discovery and message mesh plugin for Elmee"
license.workspace = true
repository.workspace = true

[dependencies]
elmee-core = { version = "0.1.0", path = "../../core" }
elmee-plugin-atomic = { version = "0.1.0", path = "../atomic" }
elmee-plugin-paths = { version = "0.1.0", path = "../paths" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.4", features = ["process"] }
