[package]
name = "elmee-plugin-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP tool plugin for elmee"
license.workspace = true
repository.workspace = true

[dependencies]
elmee-core = { version = "0.1.0", path = "../../core" }
elmee-plugin-process = { version = "0.1.0", path = "../process" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
