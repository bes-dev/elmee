name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches Cargo version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "elmee") | .version')
          test "v${version}" = "$GITHUB_REF_NAME"

  build:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Statically linked: the one to put in a container or ship inside
          # another product, where the host's libc is not ours to assume.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - if: ${{ contains(matrix.target, 'musl') }}
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo test --workspace --all-targets --locked -- --test-threads=1
      - run: cargo build --release --locked --target ${{ matrix.target }} -p elmee
      - name: Smoke and package
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/elmee"
          version=${GITHUB_REF_NAME#v}
          test "$($binary --version)" = "elmee ${version}"
          archive="elmee-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" elmee
          test "$(tar -tzf "$archive" | tr '\n' ' ')" = "elmee "
          shasum -a 256 "$archive" > "$archive.sha256"
          shasum -a 256 -c "$archive.sha256"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: target/${{ matrix.target }}/release/elmee
          format: spdx-json
          output-file: elmee-${{ matrix.target }}.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: elmee-${{ matrix.target }}
          path: |
            elmee-*.tar.gz
            elmee-*.sha256
            elmee-*.spdx.json
          if-no-files-found: error

  attest:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*.tar.gz

  publish:
    needs: [build, attest]
    if: ${{ always() && needs.build.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify packaged checksums
        working-directory: dist
        run: shasum -a 256 -c *.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/*
