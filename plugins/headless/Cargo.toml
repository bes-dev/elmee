[package]
name = "elmee-frontend-headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Headless JSONL frontend plugin for Elmee, and the child half of subagent processes"
license.workspace = true
repository.workspace = true

[dependencies]
elmee-core = { version = "0.1.0", path = "../../core" }
elmee-host = { version = "0.1.0", path = "../host", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "signal", "sync", "time"] }
