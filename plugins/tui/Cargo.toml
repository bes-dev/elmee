[package]
name = "elmee-frontend-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Interactive terminal frontend plugin for Elmee"
license.workspace = true
repository.workspace = true

[dependencies]
elmee-core = { version = "0.1.0", path = "../../core" }
elmee-plugin-atomic = { version = "0.1.0", path = "../atomic" }
elmee-host = { version = "0.1.0", path = "../host", default-features = false }
elmee-plugin-process = { version = "0.1.0", path = "../process" }
elmee-plugin-command = { version = "0.1.0", path = "../command" }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
unicode-width = "0.2"
