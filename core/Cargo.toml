[package]
name = "elmee-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The elmee agent loop: a turn, and what it takes for one to be done"
license.workspace = true
repository.workspace = true

# The loop and nothing else: no HTTP, no crypto, no runtime.
# Everything the loop cannot do alone arrives through Provider, Plugin, and
# Interactor contracts, so this crate stays embeddable in any async runtime.
[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
