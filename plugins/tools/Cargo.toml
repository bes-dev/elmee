[package]
name = "elmee-plugin-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Built-in local coding tools and core-port adapter plugin for Elmee"
license.workspace = true
repository.workspace = true

[dependencies]
elmee-core = { version = "0.1.0", path = "../../core" }
elmee-plugin-atomic = { version = "0.1.0", path = "../atomic" }
elmee-plugin-process = { version = "0.1.0", path = "../process" }
elmee-plugin-paths = { version = "0.1.0", path = "../paths" }
elmee-plugin-snapshot = { version = "0.1.0", path = "../snapshot" }
# SHA-256 freshness stamps. Already in the tree via TLS, so declaring it adds
# no binary cost.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
elmee-plugin-goal = { version = "0.1.0", path = "../goal" }
elmee-plugin-project = { version = "0.1.0", path = "../project" }
elmee-plugin-web = { version = "0.1.0", path = "../web" }
