[package]
name = "elmee-plugin-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Repository context, skills, roles, hooks, and durable memory plugin for Elmee"
license.workspace = true
repository.workspace = true

[dependencies]
elmee-core = { version = "0.1.0", path = "../../core" }
elmee-plugin-atomic = { version = "0.1.0", path = "../atomic" }
elmee-plugin-process = { version = "0.1.0", path = "../process" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }
