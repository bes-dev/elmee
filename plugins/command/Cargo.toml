[package]
name = "elmee-plugin-command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Skills as slash commands, and prompt template expansion, for Elmee"
license.workspace = true
repository.workspace = true

[dependencies]
elmee-core = { version = "0.1.0", path = "../../core" }
elmee-plugin-project = { version = "0.1.0", path = "../project" }
elmee-plugin-process = { version = "0.1.0", path = "../process" }
elmee-plugin-tools = { version = "0.1.0", path = "../tools" }
tokio = { version = "1", features = ["macros", "process", "rt", "time"] }
