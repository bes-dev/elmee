[package]
name = "elmee-plugin-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Model provider adapters, registry, and authentication plugin for Elmee"
license.workspace = true
repository.workspace = true

[dependencies]
elmee-core = { version = "0.1.0", path = "../../core" }
elmee-plugin-atomic = { version = "0.1.0", path = "../atomic" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree through the HTTP client; named for `join_all` alone.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
