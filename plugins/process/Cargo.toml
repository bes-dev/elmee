[package]
name = "elmee-plugin-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Process execution, environment overlay, capture, and OS confinement plugin for Elmee"
license.workspace = true
repository.workspace = true

[dependencies]
elmee-core = { version = "0.1.0", path = "../../core" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }
